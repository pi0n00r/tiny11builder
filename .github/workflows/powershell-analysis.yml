name: PowerShell analysis

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install pinned analyzer
        shell: powershell
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Scope CurrentUser -Force

      - name: Run static source checks
        shell: powershell
        run: .\tests\Static.Tests.ps1

      - name: Analyze hardened builder
        shell: powershell
        run: |
          Import-Module PSScriptAnalyzer -RequiredVersion 1.25.0
          $findings = @(Invoke-ScriptAnalyzer -Path .\tiny11maker.ps1)
          $findings | Format-Table -AutoSize Severity, RuleName, Line, Message
          $blocking = @($findings | Where-Object Severity -In @('Error', 'Warning'))
          if ($blocking.Count -gt 0) {
              throw "PSScriptAnalyzer returned $($blocking.Count) blocking finding(s)."
          }
